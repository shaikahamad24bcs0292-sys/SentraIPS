services:
  gateway-a:
    container_name: ipsec-gateway-a
    build:
      context: .
      dockerfile: testbed/Dockerfile
    environment:
      - GATEWAY_ROLE=gateway-a
    cap_add:
      - NET_ADMIN
    networks:
      ipsec_net:
        ipv4_address: 172.28.0.10
    volumes:
      - ./dataset/captures:/captures
    restart: unless-stopped

  gateway-b:
    container_name: ipsec-gateway-b
    build:
      context: .
      dockerfile: testbed/Dockerfile
    environment:
      - GATEWAY_ROLE=gateway-b
    cap_add:
      - NET_ADMIN
    networks:
      ipsec_net:
        ipv4_address: 172.28.0.20
    volumes:
      - ./dataset/captures:/captures
    restart: unless-stopped

networks:
  ipsec_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
